  - platform: template
    name: "SOC"
    id: soc
    unit_of_measurement: "%"
    device_class: battery
    state_class: measurement
    accuracy_decimals: 2
    lambda: |-
      if (id(soc_set_cmd).has_state()) {
        return id(soc_set_cmd).state;
      }
      return NAN;
    update_interval: 1s

  - platform: template
    name: "Uptime Pico"
    id: uptime_pico_sec
    unit_of_measurement: "s"
    state_class: measurement
    accuracy_decimals: 0
    lambda: |-
      if (std::isnan(id(millis_value).state)) {
        return NAN;
      }
      return id(millis_value).state / 1000.0f;
    update_interval: 1s

  - platform: wifi_signal
    id: wifi_rssi_sensor
    name: "WiFi RSSI"

  - platform: template
    name: "Pack Internal Voltage BMB"
    id: voltage_bmb_sum
    unit_of_measurement: "V"
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 3
    lambda: |-
      float sum = 0.0f;
      size_t valid = 0;
      const auto &cells = id(hub).get_cell_voltage_sensors();
      for (auto *cell : cells) {
        if (cell != nullptr && !isnan(cell->state)) {
          sum += cell->state;
          valid++;
        }
      }
      if (valid == 0) {
        return NAN;
      }
      return sum;
    update_interval: 1s

  - platform: template
    name: "Balance Cycle Time Remaining Seconds"
    id: max_balancing_timer
    internal: true
    unit_of_measurement: "s"
    icon: mdi:timer-sand
    state_class: measurement
    accuracy_decimals: 0
    lambda: |-
      const auto &timers = id(hub).get_balancing_time_sensors();
      float max_single = 0.0f;
      float max_adjacent_pair = 0.0f;
      float prev_timer = 0.0f;
      for (size_t i = 0; i < timers.size(); i++) {
        auto *timer = timers[i];
        float timer_s = 0.0f;
        if (timer != nullptr && !isnan(timer->state) && timer->state > 0.0f) {
          timer_s = timer->state;
        }
        if (timer_s > max_single) {
          max_single = timer_s;
        }
        const float adjacent_sum = prev_timer + timer_s;
        if (adjacent_sum > max_adjacent_pair) {
          max_adjacent_pair = adjacent_sum;
        }
        prev_timer = timer_s;
      }
      return std::max(max_single, max_adjacent_pair);
    update_interval: 1s

  # --- ENERGY SENSORS ---

  # 1. Total Power (kW) - calculated from V and A
  - platform: template
    name: "Power"
    id: power_kW
    unit_of_measurement: "kW"
    device_class: power
    state_class: measurement
    accuracy_decimals: 3
    lambda: |-
      if (std::isnan(id(voltage_mV).state) || std::isnan(id(current_mA).state)) {
        return NAN;
      }
      // Voltage is V, Current is A -> Power is W. Divide by 1000 for kW.
      return (id(voltage_mV).state * id(current_mA).state) / 1000.0f;
    update_interval: 100ms

  # 1b. Display Power (W) - integer for gauge readability
  - platform: template
    name: "Power W"
    id: power_w
    unit_of_measurement: "W"
    device_class: power
    state_class: measurement
    accuracy_decimals: 0
    lambda: |-
      if (std::isnan(id(power_kW).state)) return NAN;
      return id(power_kW).state * 1000.0f;
    update_interval: 100ms

  # 2. Split Power into Charging (Positive) and Discharging (Negative -> Positive)
  # Source is now kW, so no extra division needed.
  - platform: template
    name: "Power Charge"
    id: power_charging
    unit_of_measurement: "kW"
    device_class: power
    state_class: measurement
    accuracy_decimals: 3
    lambda: |-
      if (std::isnan(id(power_kW).state)) return NAN;
      return std::max(0.0f, id(power_kW).state);
    update_interval: 100ms

  - platform: template
    name: "Power Discharge"
    id: power_discharging
    unit_of_measurement: "kW"
    device_class: power
    state_class: measurement
    accuracy_decimals: 3
    lambda: |-
      if (std::isnan(id(power_kW).state)) return NAN;
      // Convert negative power (discharging) to positive value for integration
      return std::abs(std::min(0.0f, id(power_kW).state));
    update_interval: 100ms

