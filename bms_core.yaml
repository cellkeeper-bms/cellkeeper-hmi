      name: "Current Limit Cell Voltage Charge"
    cell_voltage_discharge_current_limit:
      id: cell_voltage_discharge_current_limit
      name: "Current Limit Cell Voltage Discharge"
    working_charge_current_limit:
      id: working_charge_current_limit
      name: "Current Limit Working Charge"
    working_discharge_current_limit:
