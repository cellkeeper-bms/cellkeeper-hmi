substitutions:
  cell_width: "9"
  cell_gap: "6"

debug:

external_components:
  - source:
      type: local
      path: components
    components: [ hmi_bms ]

# Time component required for daily energy sensors
time:
  - platform: homeassistant
    id: homeassistant_time

hmi_bms:
  id: hub
  uart_id: uart_bus
  update_interval: 100ms
  bypass_crc: true
  address: 0x01
  log_sync_prefix: "[c  0]:"

sensor:
  - platform: uptime
    id: uptime_hmi_sec
    name: "Uptime HMI"
    update_interval: 5s

  - platform: internal_temperature
    name: "Internal Temperature"

  - platform: debug
    free:
      name: "Heap Free"
    block:
      name: "Heap Max Block"
    loop_time:
      name: "Loop Time"

  - platform: hmi_bms
    soc_voltage_based:
      id: soc_voltage_based
      name: "SOC Voltage Based"
      unit_of_measurement: "%"
      device_class: battery
    soc_basic_count:
      id: soc_basic_count
      name: "SOC Basic Count"
      unit_of_measurement: "%"
      device_class: battery
    current_mA:
      id: current_mA
      name: "Current"
      unit_of_measurement: "A"
      filters:
        - multiply: 0.001
    charge_raw:
      id: charge_raw
      name: "Charge Raw"
      unit_of_measurement: "Ah"
    battery_voltage_mV:
      id: voltage_mV
      name: "Pack Internal Voltage"
      unit_of_measurement: "V"
      filters:
        - multiply: 0.001
    output_voltage_mV:
      id: output_voltage_mV
      name: "Pack Output Voltage"
      unit_of_measurement: "V"
      filters:
        - multiply: 0.001
    capacity_mC:
      id: capacity_mC
      name: "Capacity"
      unit_of_measurement: "Ah"
    temperature_min_dC:
      id: module_temperature_min
      name: "Module Temperature Min"
      unit_of_measurement: "°C"
    temperature_max_dC:
      id: module_temperature_max
      name: "Module Temperature Max"
      unit_of_measurement: "°C"
    cell_voltage_min_mV:
      id: cell_min
      name: "Cell Voltage Min"
      unit_of_measurement: "V"
      filters:
        - multiply: 0.001
    cell_voltage_max_mV:
      id: cell_max
      name: "Cell Voltage Max"
      unit_of_measurement: "V"
      filters:
        - multiply: 0.001
    millis:
      id: millis_value
      name: "Millis"
    system_sm:
      id: system_state
      name: "System State"
    system_request:
      id: system_req
      name: "System Request"
    contactor_sm:
      id: contactor_state
      name: "Contactor State"
    pos_contactor_voltage_mV:
      id: pos_contactor_voltage
      name: "Contactor Voltage Positive"
      unit_of_measurement: "V"
      filters: [multiply: 0.001]
    neg_contactor_voltage_mV:
      id: neg_contactor_voltage
      name: "Contactor Voltage Negative"
      unit_of_measurement: "V"
      filters: [multiply: 0.001]
    supply_voltage_3V3_mV:
      id: supply_3v3
      name: "Supply Voltage 3V3"
      unit_of_measurement: "V"
      filters: [multiply: 0.001]
    supply_voltage_5V_mV:
      id: supply_5v
      name: "Supply Voltage 5V"
      unit_of_measurement: "V"
      filters: [multiply: 0.001]
    supply_voltage_12V_mV:
      id: supply_12v
      name: "Supply Voltage 12V"
      unit_of_measurement: "V"
      filters: [multiply: 0.001]
    supply_voltage_contactor_mV:
      id: supply_ctr
      name: "Supply Voltage Contactor"
      unit_of_measurement: "V"
      filters: [multiply: 0.001]
    # Isolation monitor (needs BMS firmware with HMI registers 60-62). The raw ADC counts are
    # valid on every board; the resistance uses a fixed calibration that only fits some boards.
    isolation_pos_raw:
      name: "Isolation Pos Raw"
    isolation_neg_raw:
      name: "Isolation Neg Raw"
    isolation_resistance:
      name: "Isolation Resistance"
      unit_of_measurement: "MΩ"
      accuracy_decimals: 2
      filters: [multiply: 0.000001]
    cell_voltage_delta:
      id: cell_delta
      name: "Cell Voltage Delta"
      unit_of_measurement: "V"
      filters: [multiply: 0.001]
    cell_count:
      id: cell_count
      name: "Cell Count"
    charge_current_limit:
      id: charge_current_limit
      name: "Current Limit Effective Charge"
    discharge_current_limit:
      id: discharge_current_limit
      name: "Current Limit Effective Discharge"
    temp_charge_current_limit:
      id: temp_charge_current_limit
      name: "Current Limit Temperature Charge"
    temp_discharge_current_limit:
      id: temp_discharge_current_limit
      name: "Current Limit Temperature Discharge"
    cell_voltage_charge_current_limit:
