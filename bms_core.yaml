  - platform: template
    id: system_state_text
    name: "System State Text"
    lambda: |-
      static const char* states[] = {"UNINIT", "INIT", "CALIB", "INACTIVE", "OPERATING", "FAULT"};
      int val = (int)id(system_state).state;
      if (val >= 0 && val <= 5) return {states[val]};
      return {"UNKNOWN"};
    update_interval: 500ms

  - platform: template
    id: contactor_state_text
    name: "Contactor State Text"
    lambda: |-
      static const char* states[] = {
        "OPEN", "TST_PRE_CL", "TST_NEG_OP", "TST_NEG_CL", "TST_POS_OP", "TST_POS_CL",
        "PRECHG_INIT", "PRECHARGING", "CLOSED", "AWAIT_OPEN", "CALIB",
        "CAL_PRE_INIT", "CAL_PRE", "CAL_CLOSED", "CAL_NEG_INIT", "CAL_NEG",
        "PRE_FAIL", "TST_FAIL"
      };
      int val = (int)id(contactor_state).state;
      if (val >= 0 && val <= 17) return {states[val]};
      return {"UNKNOWN"};
    update_interval: 500ms

  - platform: template
    id: system_req_text
    name: "System Request Text"
    update_interval: never

  - platform: template
    id: last_event_text
    name: "Last Event Text"
    update_interval: 1s
    lambda: |-
      auto* bms = (esphome::hmi_bms::HMIBMS*) id(hub);
      int code = bms->get_last_event_code();
      if (code == -1) return {"Last Event: none"};
      int level = bms->get_last_event_level();
      int count = bms->get_last_event_count();
      const char* levels[] = {"[HIST]", "[INFO]", "[WARN]", "[ERR!]", "[CRIT]"};
      char buf[96];
      snprintf(buf, sizeof(buf), "Last Event: %s %d %s (x%d)", levels[level % 5], code, bms->get_last_event_type_str(), count);
      return {buf};

  - platform: template
    id: total_balance_cycle_time_remaining_text
    name: "Balance Cycle Time Remaining"
    update_interval: 1s
    lambda: |-
      const float remaining_s = id(max_balancing_timer).state;
      if (isnan(remaining_s) || remaining_s < 0.0f) {
        return {"unavailable"};
      }
      const int total_seconds = (int) (remaining_s + 0.5f);
      const int days = total_seconds / 86400;
      const int hours = (total_seconds % 86400) / 3600;
      const int minutes = (total_seconds % 3600) / 60;
      const int seconds = total_seconds % 60;
      char buf[48];
      snprintf(buf, sizeof(buf), "%dd %dh %dm %ds", days, hours, minutes, seconds);
      return {buf};

