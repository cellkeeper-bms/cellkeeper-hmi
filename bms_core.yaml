  - platform: template
    name: "Cells Balancing Count"
    id: cells_balancing_count
    icon: mdi:counter
    accuracy_decimals: 0
    lambda: |-
      if (!id(cells_balancing).has_state()) return 0;
      const std::string raw = id(cells_balancing).state;
      if (raw.empty() || raw == "None" || raw == "unknown" || raw == "unavailable") return 0;
      bool seen[121] = {false};
      int count = 0;
      auto mark_cell = [&](int cell) {
        if (cell >= 1 && cell <= 120 && !seen[cell]) {
          seen[cell] = true;
          count++;
        }
      };
      std::string token;
      for (size_t i = 0; i <= raw.size(); i++) {
        const char c = (i < raw.size()) ? raw[i] : ',';
        if (c == ',') {
          size_t s = 0;
          size_t e = token.size();
          while (s < e && (token[s] == ' ' || token[s] == '\t')) s++;
          while (e > s && (token[e - 1] == ' ' || token[e - 1] == '\t')) e--;
          if (e > s) {
            const std::string t = token.substr(s, e - s);
            const size_t dash = t.find('-');
            if (dash != std::string::npos) {
              const int a = atoi(t.substr(0, dash).c_str());
              const int b = atoi(t.substr(dash + 1).c_str());
              const int lo = (a < b) ? a : b;
              const int hi = (a > b) ? a : b;
              for (int cell = lo; cell <= hi; cell++) mark_cell(cell);
            } else {
              mark_cell(atoi(t.c_str()));
            }
          }
          token.clear();
        } else {
          token.push_back(c);
        }
      }
      return (float) count;
    filters:
      - round: 0
    update_interval: 1s

  - platform: template
    name: "Cells Balancing Active Count"
    id: cells_balancing_active_count
    icon: mdi:counter
    accuracy_decimals: 0
    lambda: |-
      if (!id(cells_balancing_active).has_state()) return 0;
      const std::string raw = id(cells_balancing_active).state;
      if (raw.empty() || raw == "None" || raw == "unknown" || raw == "unavailable") return 0;
      bool seen[121] = {false};
      int count = 0;
      auto mark_cell = [&](int cell) {
        if (cell >= 1 && cell <= 120 && !seen[cell]) {
          seen[cell] = true;
          count++;
        }
      };
      std::string token;
      for (size_t i = 0; i <= raw.size(); i++) {
        const char c = (i < raw.size()) ? raw[i] : ',';
        if (c == ',') {
          size_t s = 0;
          size_t e = token.size();
          while (s < e && (token[s] == ' ' || token[s] == '\t')) s++;
          while (e > s && (token[e - 1] == ' ' || token[e - 1] == '\t')) e--;
          if (e > s) {
            const std::string t = token.substr(s, e - s);
            const size_t dash = t.find('-');
            if (dash != std::string::npos) {
              const int a = atoi(t.substr(0, dash).c_str());
              const int b = atoi(t.substr(dash + 1).c_str());
              const int lo = (a < b) ? a : b;
              const int hi = (a > b) ? a : b;
              for (int cell = lo; cell <= hi; cell++) mark_cell(cell);
            } else {
              mark_cell(atoi(t.c_str()));
            }
          }
          token.clear();
        } else {
