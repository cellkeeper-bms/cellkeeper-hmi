# 1024x600 (7") LVGL UI. Pages, overlays and their update code are in ui_1024/.
# Tabs: Main | Main v2 | Control | Events | Cells | Power | Health | Config | Log | System.
# It brings its own scripts (pad, PIN, confirm), so devices using it don't include
# bms_ui_scripts.yaml (that stays for the 800x480 UI).

substitutions:
  cell_width: "9"
  cell_gap: "6"
  # Page-swipe sensitivity. LVGL's defaults (50 px travel, 3 px per read) turn
  # pages on a short brush across the 1024 px screen. Distance is at most 255.
  swipe_min_distance_px: "200"
  swipe_min_velocity_px: "6"
  # 4-digit PIN for Settings and System commands. Override it in the site file,
  # e.g. "hmi_pin: !secret hmi_pin".
  hmi_pin: "1234"
  # Idle: after this long without a touch, show Main v2 and dim the backlight.
  idle_timeout: 5min
  idle_brightness: "0.10"

packages:
  ui_main_v2: !include ui_1024/page_main_v2.yaml
  ui_main_classic: !include ui_1024/page_main_classic.yaml
  ui_control: !include ui_1024/page_control.yaml
  ui_cells: !include ui_1024/page_cells.yaml
  ui_power: !include ui_1024/page_power.yaml
  ui_health: !include ui_1024/page_health.yaml
  ui_events: !include ui_1024/page_events.yaml
  ui_settings: !include ui_1024/page_settings.yaml
  ui_bmslog: !include ui_1024/page_bmslog.yaml
  ui_system: !include ui_1024/page_system.yaml
  ui_overlays: !include ui_1024/overlays.yaml
  ui_scripts: !include ui_1024/scripts.yaml

esphome:
  on_boot:
    # After LVGL and the touchscreen have registered their input device
    priority: -200
    then:
      - lambda: |-
          for (lv_indev_t *indev = lv_indev_get_next(nullptr); indev != nullptr; indev = lv_indev_get_next(indev)) {
            lv_indev_set_gesture_min_distance(indev, ${swipe_min_distance_px});
            lv_indev_set_gesture_min_velocity(indev, ${swipe_min_velocity_px});
          }
      - lvgl.page.show: main_v2_page

font:
  # bpp 4 = anti-aliased (16 levels); the ESPHome default of 1 bit draws jagged text
  - file: "gfonts://Roboto"
    id: font_roboto_16
    size: 16
    bpp: 4
    glyphsets: [GF_Latin_Kernel]
    glyphs: ["Δ"]
  - file: "gfonts://Roboto"
    id: font_roboto_18
    size: 18
    bpp: 4
    glyphsets: [GF_Latin_Kernel]
    glyphs: ["Δ"]
  - file: "gfonts://Roboto"
    id: font_roboto_20
    size: 20
    bpp: 4
    glyphsets: [GF_Latin_Kernel]
    glyphs: ["Δ"]
  - file: "gfonts://Roboto"
    id: font_roboto_24
    size: 24
    bpp: 4
    glyphsets: [GF_Latin_Kernel]
    glyphs: ["Δ"]
  - file: "gfonts://Roboto"
    id: font_roboto_28
    size: 28
    bpp: 4
  - file: "gfonts://Roboto"
    id: font_roboto_32
    size: 32
    bpp: 4
  - file: "gfonts://Roboto"
    id: font_roboto_40
    size: 40
    bpp: 4
  - file: "gfonts://Roboto"
    id: font_roboto_48
    size: 48
    bpp: 4
    glyphsets: [GF_Latin_Kernel]
    glyphs: ["Ω"]
  - file: "gfonts://Roboto"
    id: font_roboto_60
    size: 60
    bpp: 4
  - file: "gfonts://Roboto Mono"
    id: font_roboto_mono_14
    size: 14
    bpp: 4
  - file: "gfonts://Roboto Mono"
    id: font_roboto_mono_16
    size: 16
    bpp: 4
  - file: "gfonts://Roboto"
    id: font_roboto_80
    size: 80
    bpp: 4

lvgl:
  id: my_lvgl
  displays: my_display
  touchscreens: my_touchscreen
  bg_color: 0x000000
  disp_bg_color: 0x000000
  buffer_size: 20%
  byte_order: little_endian
  on_idle:
    timeout: ${idle_timeout}
    then:
      - lambda: |-
          // Close any pop-up, go back to Main v2 and dim until the next touch. The wake
          // layer takes that touch, so it only wakes the screen.
          lv_obj_add_flag(id(pad_overlay), LV_OBJ_FLAG_HIDDEN);
          lv_obj_add_flag(id(confirm_overlay), LV_OBJ_FLAG_HIDDEN);
          lv_obj_add_flag(id(event_popup), LV_OBJ_FLAG_HIDDEN);
          lv_obj_add_flag(id(wifi_overlay), LV_OBJ_FLAG_HIDDEN);
          lv_obj_clear_flag(id(wake_layer), LV_OBJ_FLAG_HIDDEN);
          if (!id(ui_dimmed)) {
            auto &cv = id(display_backlight).current_values;
            id(ui_bright) = cv.is_on() ? cv.get_brightness() : 0.4f;
            id(ui_dimmed) = true;
            auto call = id(display_backlight).turn_on();
            call.set_brightness(${idle_brightness});
            call.perform();
          }
      - lvgl.page.show: main_v2_page
