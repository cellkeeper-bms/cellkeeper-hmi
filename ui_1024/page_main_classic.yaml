# 1024x600 UI: the classic main page, unchanged apart from its swipe targets and the
# tab-bar hook. Its values are updated in scripts.yaml (copied from bms_ui_scripts.yaml).

lvgl:
  pages:
    - id: energy_page
      on_load:
        - script.execute: {id: nav_set, tab: 0}
      on_swipe_left:
        - lvgl.page.show: main_v2_page
      on_swipe_right:
        - lvgl.page.show: system_page
      widgets:
        - label:
            id: label_events_energy
            text: ""
            align: TOP_MID
            y: 0
            width: 100%
            text_align: CENTER
            text_font: font_roboto_20
            text_color: 0xFFFFFF
            bg_opa: 100%
            bg_color: 0x000000

        - label:
            id: label_contactor_energy
            text: "Contactor: 0 OPEN / OFF"
            align: TOP_LEFT
            x: 40
            y: 400
            width: 440
            long_mode: CLIP
            text_align: LEFT
            text_font: font_roboto_40
            text_color: 0xFFFFFF

        - arc:
            id: energy_soc_arc
            width: 340
            height: 340
            align: TOP_LEFT
            x: 40
            y: 40
            min_value: 0
            max_value: 100
            bg_color: 0x1A1A1A
            widgets:
              - label:
                  id: label_soc_energy
                  text: " "
                  align: CENTER
                  text_font: font_roboto_80
                  text_color: 0xFFFFFF
              - label:
                  text: "SOC"
                  align: CENTER
                  y: 50
                  text_font: font_roboto_20
                  text_color: 0xAAAAAA

        - arc:
            id: energy_soc_delta_arc
            width: 300
            height: 300
            align: TOP_LEFT
            x: 60
            y: 60
            min_value: 0
            max_value: 100
            value: 0
            bg_opa: 0%
            arc_width: 8
            arc_color: 0xFFD54A

        - label:
            id: label_soc_delta_1h_energy
            text: "1h change: ---%"
            align: TOP_LEFT
            x: 40
            y: 290
            width: 340
            text_align: CENTER
            text_font: font_roboto_20
            text_color: 0xFFD54A

        - label:
            id: label_power_title_energy
            text: "POWER"
            align: TOP_RIGHT
            x: -110
            y: 38
            width: 320
            text_align: CENTER
            text_font: font_roboto_20
            text_color: 0xAAAAAA

        - line:
            id: power_scale_energy
            width: 320
            height: 1
            align: TOP_RIGHT
            x: -110
            y: 76
            line_width: 2
            line_color: 0xDDDDDD
            points:
              - 0, 0
              - 320, 0

        - line:
            width: 1
            height: 14
            align: TOP_RIGHT
            x: -430
            y: 62
            line_width: 2
            line_color: 0xDDDDDD
