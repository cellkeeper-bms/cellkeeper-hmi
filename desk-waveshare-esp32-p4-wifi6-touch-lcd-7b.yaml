# Device entry point: device-specific name, secrets (connection), and packages.
# Desk Waveshare – same hardware as waveshare-esp32-p4-wifi6-touch-lcd-7b, site-specific device name.
# Secrets are in this file so they stay at top level; values come from secrets.yaml.

esphome:
  name: ck0-waveshare-p4-7b  # must be unique per network (ESPHome allows no underscores)
  friendly_name: ck0_waveshare-p4-7b  # entity IDs become ck0_waveshare_p4_7b_...
  min_version: 2025.11.0
  project:
    name: "CellKeeper.ESP32-P4-WIFI6-Touch-LCD-7B"
    version: "1.0b"
  on_boot:
    priority: -100
    then:
      - lvgl.resume: {}
      - light.turn_on:
          id: display_backlight
          brightness: 30%

packages:
  core: !include bms_core.yaml
  ui: !include bms_ui_scripts.yaml
  hardware: !include hardware_waveshare_esp32p4_wifi6_lcd7b.yaml

web_server:
  port: 80
  auth:
    username: !secret web_server_username
    password: !secret web_server_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none
  reboot_timeout: 0s

api:
  encryption:
    key: !secret api_encryption_key
  reboot_timeout: 0s

ota:
  - platform: esphome
    password: !secret ota_password
    on_begin:
      then:
        - lvgl.resume: {}
        - light.turn_on:
            id: display_backlight
            brightness: 70%
        - lambda: |-
            lv_obj_t *overlay = lv_obj_create(lv_layer_top());
            lv_obj_remove_style_all(overlay);
            lv_obj_set_size(overlay, LV_PCT(100), LV_PCT(100));
            lv_obj_clear_flag(overlay, LV_OBJ_FLAG_SCROLLABLE);
            lv_obj_set_style_bg_color(overlay, lv_color_black(), LV_PART_MAIN);
            lv_obj_set_style_bg_opa(overlay, LV_OPA_80, LV_PART_MAIN);

            lv_obj_t *label = lv_label_create(overlay);
            lv_label_set_text(label, "FIRMWARE UPDATE\nSTARTING...");
            lv_obj_set_style_text_color(label, lv_color_white(), LV_PART_MAIN);
            lv_obj_set_style_text_align(label, LV_TEXT_ALIGN_CENTER, LV_PART_MAIN);
            lv_obj_center(label);
        - delay: 2s
        - light.turn_off: display_backlight
        - lvgl.pause: {}
  - platform: web_server
    on_begin:
      then:
        - lvgl.resume: {}
        - light.turn_on:
            id: display_backlight
            brightness: 70%
        - lambda: |-
            lv_obj_t *overlay = lv_obj_create(lv_layer_top());
            lv_obj_remove_style_all(overlay);
            lv_obj_set_size(overlay, LV_PCT(100), LV_PCT(100));
            lv_obj_clear_flag(overlay, LV_OBJ_FLAG_SCROLLABLE);
            lv_obj_set_style_bg_color(overlay, lv_color_black(), LV_PART_MAIN);
            lv_obj_set_style_bg_opa(overlay, LV_OPA_80, LV_PART_MAIN);

            lv_obj_t *label = lv_label_create(overlay);
            lv_label_set_text(label, "FIRMWARE UPDATE\nSTARTING...");
            lv_obj_set_style_text_color(label, lv_color_white(), LV_PART_MAIN);
            lv_obj_set_style_text_align(label, LV_TEXT_ALIGN_CENTER, LV_PART_MAIN);
            lv_obj_center(label);
        - delay: 2s
        - light.turn_off: display_backlight
        - lvgl.pause: {}

safe_mode:
  disabled: true
