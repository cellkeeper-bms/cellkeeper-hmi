title: BMS Dashboard
decluttering_templates:
  detail2_voltage_capacity:
    card:
      type: entities
      title: Voltage & Capacity
      entities:
        - entity: 'sensor.[[node]]_pack_internal_voltage'
          name: Pack Internal Voltage
        - entity: 'sensor.[[node]]_pack_output_voltage'
          name: Pack Output Voltage
        - entity: 'sensor.[[node]]_pack_internal_voltage_bmb'
          name: Pack Internal Voltage BMB
        - entity: 'sensor.[[node]]_contactor_voltage_positive'
          name: Contactor Voltage Positive
        - entity: 'sensor.[[node]]_contactor_voltage_negative'
          name: Contactor Voltage Negative
        - entity: 'sensor.[[node]]_capacity'
          name: Capacity
        - entity: 'sensor.[[node]]_charge_raw'
          name: Charge Raw
        - entity: 'sensor.[[node]]_soc'
          name: SOC
        - entity: 'sensor.[[node]]_soc_voltage_based'
          name: SOC Voltage Based
        - entity: 'sensor.[[node]]_soc_basic_count'
          name: SOC Basic Count
  detail2_isolation:
    card:
      type: entities
      title: Isolation
      entities:
        - entity: 'sensor.[[node]]_pack_pos_to_chassis'
          name: Pack Pos to Chassis
        - entity: 'sensor.[[node]]_pack_neg_to_chassis'
          name: Pack Neg to Chassis
        - entity: 'sensor.[[node]]_isolation_resistance'
          name: Isolation Resistance
        - entity: 'sensor.[[node]]_isolation_check_age'
          name: Isolation Check Age
  detail2_inverter_can_values:
    card:
      type: entities
      title: Inverter CAN Values
      entities:
        - entity: 'sensor.[[node]]_inverter_can_soc'
          name: Inverter CAN SOC
        - entity: 'sensor.[[node]]_inverter_can_capacity_full'
          name: Inverter CAN Capacity Full
        - entity: 'sensor.[[node]]_inverter_can_capacity_remaining'
          name: Inverter CAN Capacity Remaining
        - entity: 'sensor.[[node]]_inverter_can_voltage_limit_min'
          name: Inverter CAN Voltage Limit Min
        - entity: 'sensor.[[node]]_inverter_can_voltage_limit_max'
          name: Inverter CAN Voltage Limit Max
        - entity: 'sensor.[[node]]_current_limit_effective_charge'
          name: Inverter CAN Charge Limit
        - entity: 'sensor.[[node]]_current_limit_effective_discharge'
          name: Inverter CAN Discharge Limit
  detail2_energy_stats:
    card:
      type: entities
      title: Energy Stats
      entities:
        - entity: 'sensor.[[node]]_power_charge'
          name: Power Charge
        - entity: 'sensor.[[node]]_power_discharge'
          name: Power Discharge
        - entity: 'sensor.[[node]]_energy_daily_charge'
          name: Energy Daily Charge
        - entity: 'sensor.[[node]]_energy_daily_discharge'
          name: Energy Daily Discharge
        - entity: 'sensor.[[node]]_energy_daily_net'
          name: Energy Daily Net
  detail2_temperature:
    card:
      type: entities
      title: Temperature
      entities:
        - entity: 'sensor.[[node]]_module_temperature_min'
          name: Module Temperature Min
        - entity: 'sensor.[[node]]_module_temperature_max'
          name: Module Temperature Max
  detail2_module_temperatures:
    card:
      type: entities
      title: Module Temperatures
      entities:
        - entity: 'sensor.[[node]]_module_temperature_1'
          name: Module Temperature 1
        - entity: 'sensor.[[node]]_module_temperature_2'
          name: Module Temperature 2
        - entity: 'sensor.[[node]]_module_temperature_3'
          name: Module Temperature 3
        - entity: 'sensor.[[node]]_module_temperature_4'
          name: Module Temperature 4
        - entity: 'sensor.[[node]]_module_temperature_5'
          name: Module Temperature 5
        - entity: 'sensor.[[node]]_module_temperature_6'
          name: Module Temperature 6
        - entity: 'sensor.[[node]]_module_temperature_7'
          name: Module Temperature 7
        - entity: 'sensor.[[node]]_module_temperature_8'
          name: Module Temperature 8
views:
  - title: Overview
    type: sections
    max_columns: 3
    sections:
      - cards:
          - type: heading
            heading: Overview
          - type: custom:auto-entities
            card:
              type: grid
              title: Active Events
              columns: 2
              square: false
            card_param: cards
            filter:
              template: >
                {% for state in states.sensor | selectattr('entity_id',
                'search', 'ck0_event_(fatal|critical|warning|info)_') |
                sort(attribute='attributes.friendly_name') -%}
                  {% if state.state not in ['INACTIVE', 'unknown', 'unavailable'] and not state.state.startswith('INACTIVE') -%}
                    {% set color = '#2196F3' -%}
                    {% set level = 'Info' -%}
                    {% if 'FATAL' in state.state %}{% set color = '#D50000' -%}{% set level = 'Fatal' -%}
                    {% elif 'CRITICAL' in state.state %}{% set color = '#F44336' -%}{% set level = 'Critical' -%}
                    {% elif 'WARNING' in state.state %}{% set color = '#FFC107' -%}{% set level = 'Warning' -%}
                    {% elif 'INFO' in state.state %}{% set color = '#2196F3' -%}{% set level = 'Info' -%}
                    {% elif 'fatal' in state.entity_id %}{% set color = '#D50000' -%}{% set level = 'Fatal' -%}
                    {% elif 'critical' in state.entity_id %}{% set color = '#F44336' -%}{% set level = 'Critical' -%}
                    {% elif 'warning' in state.entity_id %}{% set color = '#FFC107' -%}{% set level = 'Warning' -%}
                    {% elif 'info' in state.entity_id %}{% set color = '#2196F3' -%}{% set level = 'Info' -%}
                    {% endif -%}
                    {{
                      {
                        "type": "tile",
                        "entity": state.entity_id,
                        "name": (state.attributes.friendly_name | replace("CellKeeper0", "") | replace("ck0", "") | replace("Event Fatal ", "") | replace("Event Critical ", "") | replace("Event Warning ", "") | replace("Event Info ", "") | trim),
                        "color": color,
                        "card_mod": {
                          "style": "ha-card { --tile-color: " + color + " !important; }"
                        }
                      }
                    }},
                  {%- endif %}
                {%- endfor %}
            show_empty: false
            unique: true
          - type: custom:mushroom-title-card
            title: BMS Status
            subtitle: Battery Management System Overview
          - type: grid
            columns: 2
            square: false
            cards:
              - type: gauge
                entity: sensor.ck0_soc
                name: SOC
                unit: '%'
                min: 0
                max: 100
                needle: true
                severity:
                  green: 30
                  yellow: 10
                  red: 0
              - type: gauge
                entity: sensor.ck0_pack_internal_voltage
                name: Pack Internal Voltage
                min: 288
                max: 410
                needle: true
                segments:
                  - from: 288
                    color: '#db4437'
                  - from: 300
                    color: '#ffa600'
                  - from: 330
                    color: '#43a047'
                  - from: 400
                    color: '#db4437'
              - type: gauge
                entity: sensor.ck0_cell_voltage_min
                name: Cell Voltage Min
                min: 2.95
                max: 4.25
                needle: true
                segments:
                  - from: 2.95
                    color: '#db4437'
                  - from: 3
                    color: '#ffa600'
                  - from: 3.3
                    color: '#43a047'
                  - from: 4.15
                    color: '#ffa600'
                  - from: 4.2
                    color: '#db4437'
              - type: gauge
                entity: sensor.ck0_cell_voltage_max
                name: Cell Voltage Max
                min: 2.95
                max: 4.25
                needle: true
                segments:
                  - from: 2.95
                    color: '#db4437'
                  - from: 3
                    color: '#ffa600'
                  - from: 3.3
                    color: '#43a047'
                  - from: 4.15
                    color: '#ffa600'
                  - from: 4.2
                    color: '#db4437'
              - type: gauge
                entity: sensor.ck0_current
                name: Current
                min: -200
                max: 200
                needle: true
                severity:
                  green: 0
                  red: -200
              - type: gauge
                entity: sensor.ck0_power_w
                name: Power
                unit: W
                min: -10000
                max: 10000
                needle: true
                severity:
                  green: 0
                  red: -10000
          - type: entities
            title: System Status
            entities:
              - entity: sensor.ck0_system_state_text
                name: System State
              - entity: sensor.ck0_contactor_state_text
                name: Contactor State
              - entity: button.ck0_run
                name: Run BMS
                icon: mdi:play
              - entity: button.ck0_stop
                name: Stop BMS
                icon: mdi:stop
              - entity: button.ck0_calibrate
                name: Offline Calibration (Inverter Disconnected, Contactors Open)
                icon: mdi:wrench
