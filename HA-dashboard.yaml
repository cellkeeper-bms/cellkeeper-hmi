  - title: Configuration
    type: sections
    max_columns: 4
    sections:
      - cards:
          - type: heading
            heading: Configuration Guide
          - type: markdown
            content: >
              ## BMS Configuration

              Use **Settings Unlock Mode** to allow writes. When locked, values
              are read-only and write attempts are blocked.


              ### Voltage Protection Tiers

              - **Working Limits**: Defines the 0% to 100% SoC range used for
              normal operation.

              - **Soft Limits**: Triggers warning behavior and current limiting
              if exceeded.

              - **Hard Limits**: Firmware safety limits that force immediate
              disconnect.


              **Tip:** Set Working Min to your inverter's 0% SoC voltage point.
      - cards:
          - type: heading
            heading: Access & Write Status
          - type: grid
            columns: 1
            square: false
            cards:
              - type: entities
                title: Settings Unlock
                show_header_toggle: false
                entities:
                  - entity: switch.ck0_settings_unlock
                    name: Settings Unlock
              - type: tile
                entity: sensor.ck0_settings_status
                name: Settings Status
                card_mod:
                  style: |
                    ha-card {
                      {% set state = states(config.entity) %}
                      {% set state_l = state | lower %}
                      {% if 'settings applied' in state_l %}
                        --tile-color: #4CAF50 !important;
                        --primary-text-color: #4CAF50 !important;
                        --secondary-text-color: #4CAF50 !important;
                      {% elif 'auto-locked' in state_l %}
                        --tile-color: #D50000 !important;
                        --primary-text-color: #D50000 !important;
                        --secondary-text-color: #D50000 !important;
                      {% elif 'locked (unlock to apply)' in state_l %}
                        --tile-color: #D50000 !important;
                        --primary-text-color: #D50000 !important;
                        --secondary-text-color: #D50000 !important;
                      {% elif 'settings unlocked' in state_l %}
                        --tile-color: #2196F3 !important;
                        --primary-text-color: #2196F3 !important;
                        --secondary-text-color: #2196F3 !important;
                      {% elif 'settings locked' in state_l %}
                        --tile-color: #9E9E9E !important;
                        --primary-text-color: #9E9E9E !important;
                        --secondary-text-color: #9E9E9E !important;
                      {% endif %}
                    }
      - cards:
          - type: heading
            heading: SOC and Current
          - type: grid
            columns: 2
            square: false
            cards:
              - type: tile
                entity: number.ck0_soc_set_cmd
                name: SOC Set Cmd
                features_position: bottom
                features:
                  - type: numeric-input
                    style: buttons
              - type: tile
                entity: number.ck0_soc_scaling_min
                name: SOC Scale Min
                features_position: bottom
                features:
                  - type: numeric-input
                    style: buttons
              - type: tile
                entity: number.ck0_soc_scaling_max
                name: SOC Scale Max
                features_position: bottom
                features:
                  - type: numeric-input
                    style: buttons
              - type: tile
                entity: number.ck0_max_charge_current
                name: Max Chg Curr
                features_position: bottom
                features:
                  - type: numeric-input
                    style: buttons
              - type: tile
                entity: number.ck0_max_discharge_current
                name: Max Dchg Curr
                features_position: bottom
                features:
                  - type: numeric-input
                    style: buttons
          - type: entities
            title: Current Limit Readback
            entities:
              - entity: sensor.ck0_current_limit_effective_charge
                name: Current Limit Effective Charge
              - entity: sensor.ck0_current_limit_effective_discharge
                name: Current Limit Effective Discharge
              - entity: sensor.ck0_current_limit_temperature_charge
                name: Current Limit Temperature Charge
              - entity: sensor.ck0_current_limit_temperature_discharge
                name: Current Limit Temperature Discharge
              - entity: sensor.ck0_current_limit_cell_voltage_charge
                name: Current Limit Cell Voltage Charge
              - entity: sensor.ck0_current_limit_cell_voltage_discharge
                name: Current Limit Cell Voltage Discharge
              - entity: sensor.ck0_current_limit_working_charge
                name: Current Limit Working Charge
              - entity: sensor.ck0_current_limit_working_discharge
                name: Current Limit Working Discharge
              - entity: sensor.ck0_current_limit_delta_charge
                name: Current Limit Delta Charge
              - entity: sensor.ck0_current_limit_hard_charge
                name: Current Limit Hard Charge
              - entity: sensor.ck0_current_limit_hard_discharge
                name: Current Limit Hard Discharge
      - cards:
          - type: heading
            heading: Voltage Limits
          - type: grid
            columns: 2
            square: false
            cards:
              - type: tile
                entity: number.ck0_voltage_limit_offset_lower
                name: VLimit Offs Low
                features_position: bottom
                features:
                  - type: numeric-input
                    style: buttons
              - type: tile
                entity: number.ck0_voltage_limit_offset_upper
                name: VLimit Offs High
                features_position: bottom
                features:
                  - type: numeric-input
                    style: buttons
              - type: tile
                entity: number.ck0_cell_voltage_working_min
                name: CellV Work Min
                features_position: bottom
                features:
                  - type: numeric-input
                    style: buttons
              - type: tile
                entity: number.ck0_cell_voltage_working_max
                name: CellV Work Max
                features_position: bottom
                features:
                  - type: numeric-input
                    style: buttons
              - type: tile
                entity: number.ck0_cell_voltage_soft_min
                name: CellV Soft Min
                features_position: bottom
                features:
                  - type: numeric-input
                    style: buttons
              - type: tile
                entity: number.ck0_cell_voltage_soft_max
                name: CellV Soft Max
                features_position: bottom
                features:
                  - type: numeric-input
                    style: buttons
      - cards:
          - type: heading
            heading: Balancing
          - type: markdown
            content: |
              **Note:** `Auto Bal Period` is in milliseconds.
              - `0` = balancing disabled
              - `30000` = 30 second balancing period
          - type: grid
            columns: 2
            square: false
            cards:
              - type: tile
                entity: number.ck0_auto_balancing_period
                name: Auto Bal Period
                features_position: bottom
                features:
                  - type: numeric-input
                    style: buttons
              - type: tile
                entity: number.ck0_balancing_periods_per_mv
                name: Bal Periods/mV
                features_position: bottom
                features:
                  - type: numeric-input
                    style: buttons
              - type: tile
                entity: number.ck0_balance_min_offset
                name: Bal Min Offset
                features_position: bottom
                features:
                  - type: numeric-input
                    style: buttons
              - type: tile
                entity: number.ck0_minimum_balancing_voltage
                name: Min Bal V
                features_position: bottom
                features:
                  - type: numeric-input
                    style: buttons
              - type: tile
                entity: number.ck0_balancing_start_voltage
                name: Bal Start V
                features_position: bottom
                features:
                  - type: numeric-input
                    style: buttons
      - cards:
          - type: heading
            heading: Isolation Calibration
          - type: markdown
            content: >
              All isolation values are calculated by the BMS. At every boot,
              while the contactors are still open, the BMS checks the zero: small
              drift is blended in, a large offset raises **Isolation Asymmetry**
              (possible leak) and the zero is kept. Isolation Resistance is live
              with the contactors open and otherwise shows the last open reading
              (see Isolation Check Age; capped at 100 Mohm). Press **Calibrate
              Isolation Zero** with the battery stopped only after ruling out a
              leak; it overwrites the zero.
          - type: entities
            entities:
              - entity: sensor.ck0_contactor_state_text
                name: Contactor State
              - entity: button.ck0_calibrate_isolation_zero
                name: Calibrate Isolation Zero
              - entity: sensor.ck0_pack_pos_to_chassis
                name: Pack Pos to Chassis
              - entity: sensor.ck0_pack_neg_to_chassis
                name: Pack Neg to Chassis
              - entity: sensor.ck0_isolation_resistance
                name: Isolation Resistance
              - entity: sensor.ck0_isolation_check_age
                name: Isolation Check Age
