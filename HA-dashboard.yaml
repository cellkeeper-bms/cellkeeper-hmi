              - entity: sensor.ck0_cells_balancing
                internal: true
                filters:
                  - resample: 1m
                fn: |
                  $ex {
                    vars.balance_x = [];
                    vars.balance_y = [];
                    const n = Math.min(xs.length, ys.length);
                    for (let i = 0; i < n; i++) {
                      const raw = (ys[i] ?? "").toString().trim();
                      if (!raw || raw === "None" || raw === "unknown" || raw === "unavailable") {
                        continue;
                      }
                      const tokens = raw.split(",");
                      for (const token of tokens) {
                        const t = token.trim();
                        if (!t) continue;
                        const range = t.match(/^(\d+)\s*-\s*(\d+)$/);
                        if (range) {
                          const a = parseInt(range[1], 10);
                          const b = parseInt(range[2], 10);
                          if (isNaN(a) || isNaN(b)) continue;
                          const lo = Math.min(a, b);
                          const hi = Math.max(a, b);
                          for (let cell = lo; cell <= hi; cell++) {
                            if (cell > 0 && cell <= vars.cell_count) {
                              vars.balance_x.push(xs[i]);
                              vars.balance_y.push(cell);
                            }
                          }
                        } else {
                          const cell = parseInt(t, 10);
                          if (!isNaN(cell) && cell > 0 && cell <= vars.cell_count) {
                            vars.balance_x.push(xs[i]);
                            vars.balance_y.push(cell);
                          }
                        }
                      }
                    }
                  }
              - entity: sensor.ck0_cells_balancing_active
                internal: true
                filters:
                  - resample: 1m
                fn: |
                  $ex {
                    vars.active_x = [];
                    vars.active_y = [];
                    const n = Math.min(xs.length, ys.length);
                    for (let i = 0; i < n; i++) {
                      const raw = (ys[i] ?? "").toString().trim();
